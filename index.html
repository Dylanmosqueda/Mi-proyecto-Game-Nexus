<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameNexus - Halo Combat Evolved</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #070a0e;
            color: #e2f1f8;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at center, rgba(0, 240, 255, 0.08) 0%, #05080c 100%), 
                              linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px #000, inset 0 0 80px rgba(0, 240, 255, 0.15);
            pointer-events: none;
        }

        .unsc-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .shield-emitter {
            position: relative;
            margin-bottom: 20px;
        }

        .unsc-emblem {
            font-size: 7rem;
            color: #00f0ff;
            text-shadow: 0 0 30px #00f0ff;
            animation: pulse 3s infinite ease-in-out;
        }

        .spartan-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #ffffff;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00f0ff;
            margin: 10px 0;
        }

        .cortana-subtitle {
            font-family: 'Share Tech Mono', monospace;
            color: #ffb400;
            font-size: 1.2rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .btn-spartan {
            padding: 20px 50px;
            background: #3e4d30;
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            text-decoration: none;
            letter-spacing: 3px;
            border: 2px solid #00f0ff;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-spartan:hover {
            background: #00f0ff;
            color: #0b0e14;
            box-shadow: 0 0 50px #00f0ff;
            transform: scale(1.08);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px #00f0ff); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 40px #ffb400); }
        }
    </style>
</head>
<body>

    <div class="unsc-container">
        <div class="shield-emitter">
            <div class="unsc-emblem">🛡️</div>
        </div>

        <h1 class="spartan-title">BIENVENIDO, SPARTAN DYLAN</h1>
        <p class="cortana-subtitle">SISTEMA MJOLNIR MARK V ONLINE. CORTANA EN LÍNEA.</p>

        <a href="https://github.com/Dylanmosqueda/Mi-proyecto-Game-Nexus" class="btn-spartan">
            ACCEDER A LA BASE DE DATOS UNSC
        </a>
    </div>

</body>
</html>
